name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-quality:
    name: Local tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run local tests
        run: python -m pytest -m "not external"

  external-api:
    name: Restful Booker external tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Run external API tests
        run: python -m pytest -m external
