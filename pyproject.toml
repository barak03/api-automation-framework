[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-automation-framework"
version = "0.1.0"
description = "A focused pytest framework for the Restful Booker API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

